---
layout: site
---

<div class="wrap">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="sub">{{ page.subtitle }}</p>{% endif %}
  </header>

  {% include labeled-sections.html sections=page.sections %}

  {% assign body = content | strip %}
  {% if body != "" %}<div class="page-body">{{ content }}</div>{% endif %}
</div>
